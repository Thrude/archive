<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive // Writing Log</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>

<link rel="stylesheet" href="IndexStyle.css">

<style>
    :root {
        --bg: #f5f2ed;
        --text: #1a1a1a;
        --border: #d1cdc7;
        --accent: #6200ff;
        --hover-bg: #ece8e1;
    }

    .darkmode {
        --bg: #121212;
        --text: #e0ddd5;
        --border: #2a2a2a;
        --accent: #bb86fc;
        --hover-bg: #1a1a1a;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        transition: background-color 0.3s ease, color 0.3s ease;
        margin: 0;
        padding: 20px;
        text-transform: lowercase;
    }

    #theme-switch {
        height: 50px;
        width: 50px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--border);
        background-color: var(--bg);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 20px;
        right: 20px;
        transition: all 0.3s ease;
        z-index: 100;
    }

    #theme-switch svg { fill: var(--text); }
    #theme-switch svg:first-child { display: none; }
    .darkmode #theme-switch svg:first-child { display: block; }
    .darkmode #theme-switch svg:last-child { display: none; }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 20px;
        margin-bottom: 60px;
    }

    h1 { font-weight: 400; font-size: 1.2rem; margin: 0; }

    .back-link {
        text-decoration: none;
        color: #888;
        font-size: 0.8rem;
        transition: color 0.3s;
        display: block;
        margin-bottom: 40px;
    }
    .back-link:hover { color: var(--text); }

    .section-label {
        font-size: 0.7rem;
        color: #888;
        margin-bottom: 20px;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .filter-row {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }

    .filter-btn {
        background: none;
        border: none;
        border-bottom: 1px solid transparent;
        color: #888;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        cursor: pointer;
        padding: 2px 0;
        transition: all 0.2s;
        text-transform: lowercase;
    }
    .filter-btn:hover, .filter-btn.active {
        color: var(--text);
        border-bottom-color: var(--accent);
    }

    .entry-count {
        font-size: 0.65rem;
        color: var(--accent);   
        margin-bottom: 10px;
    }

    .file-list {
        border-top: 1px solid var(--border);
    }

    .entry-item {
        border-bottom: 1px solid var(--border);
        padding: 28px 0;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .entry-item:hover {
        background: var(--hover-bg);
        padding-left: 8px;
        padding-right: 8px;
        margin-left: -8px;
        margin-right: -8px;
    }

    .entry-meta-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
    }

    .entry-id {
        font-size: 0.65rem;
        color: #888;
        min-width: 64px;
        flex-shrink: 0;
    }

    .entry-title {
        font-size: 1rem;
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
    }

    .entry-title-text { font-weight: 400; }

    .entry-toggle {
        font-size: 0.7rem;
        color: #888;
        white-space: nowrap;
    }

    .entry-date {
        font-size: 0.65rem;
        color: #888;
        margin-top: 6px;
        padding-left: 76px;
    }

    .entry-cat-tag {
        font-size: 0.6rem;
        color: var(--accent);
        padding-left: 76px;
        margin-top: 4px;
        display: block;
    }

    .entry-body {
        display: none;
        font-size: 0.82rem;
        color: #888;
        padding-left: 76px;
        margin-top: 14px;
        line-height: 1.85;
        max-width: 680px;
    }

    .entry-item.open .entry-body { display: block; }
    .entry-item.open .entry-toggle::after { content: ' [−]'; }
    .entry-item:not(.open) .entry-toggle::after { content: ' [+]'; }
    .entry-item[data-hidden="true"] { display: none; }

    .loading-msg {
        font-size: 0.75rem;
        color: #888;
        padding: 30px 0;
        border-bottom: 1px solid var(--border);
    }

    footer {
        margin-top: 100px;
        padding-top: 40px;
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
        color: #888;
    }

    .footer-links a {
        color: var(--text);
        text-decoration: none;
        margin-right: 20px;
        transition: opacity 0.2s;
    }
    .footer-links a:hover { opacity: 0.6; }

    #preloader {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw; height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        transition: opacity 0.3s ease;
        opacity: 1;
        z-index: 9999;
    }
</style>

<script>
    const themeSwitch = document.getElementById('theme-switch');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') { body.classList.add('darkmode'); }
    themeSwitch.addEventListener('click', () => {
        body.classList.toggle('darkmode');
        localStorage.setItem('theme', body.classList.contains('darkmode') ? 'dark' : 'light');
    });
</script>

<body>
    <div class="container">

        <a href="kintas web.html" class="back-link">← return_to_archive</a>

        <header>
            <h1>kinta's archive // writing_log</h1>
        </header>

        <div class="section-label">// filter_by</div>

        <div class="filter-row">
            <button class="filter-btn active" onclick="filterEntries('all', this)">all</button>
            <button class="filter-btn" onclick="filterEntries('updates', this)">updates</button>
            <button class="filter-btn" onclick="filterEntries('note', this)">note</button>
            <button class="filter-btn" onclick="filterEntries('thoughts', this)">thoughts</button>
        </div>

        <div class="section-label">// entries</div>
        <div class="entry-count" id="entry-count">loading...</div>
        <div class="file-list" id="entries">
            <div class="loading-msg">// fetching entries...</div>
        </div>

        <footer>
            <div class="footer-links">
                <p>links:</p>
                <a href="https://www.instagram.com/kintachoo/?hl=en">instagram</a>
                <a href="#">linkedin</a>
                <a href="contacts.html">email</a>
            </div>
            <p style="margin-top: 20px;">© 2026 / compiled in bkk-koinophobia</p>
        </footer>

    </div>
</body>

<script>
    function toggleEntry(el) {
        el.classList.toggle('open');
    }

    function filterEntries(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const entries = document.querySelectorAll('.entry-item');
        let visible = 0;
        entries.forEach(e => {
            if (cat === 'all' || e.dataset.cat === cat) {
                e.setAttribute('data-hidden', 'false');
                visible++;
            } else {
                e.setAttribute('data-hidden', 'true');
                e.classList.remove('open');
            }
        });
        document.getElementById('entry-count').textContent = visible + (visible === 1 ? ' entry' : ' entries');
    }

    async function loadEntries() {
        const WORKER_URL = "https://writer.chaoslegend234.workers.dev/";

        const container = document.getElementById("entries");
        const countEl = document.getElementById("entry-count");

        try {
            const res = await fetch(WORKER_URL);
            const data = await res.json();
            const results = data.results;

            container.innerHTML = "";
            countEl.textContent = results.length + " entries";

            results.forEach((page, i) => {
                const title = page.properties.Title?.title[0]?.plain_text || "untitled";
                const date = page.properties.Date?.date?.start || "";
                const categoryProp = page.properties.Category;

// This checks for a Select property first, then falls back to check 
// for a Multi-Select property, and finally defaults to "note" if both are empty.
const cat = categoryProp?.select?.name || categoryProp?.multi_select?.[0]?.name || "note";
                const body = page.properties.Body?.rich_text[0]?.plain_text || "";
                const num = String(results.length - i).padStart(2, "0");

                container.innerHTML += `
                    <div class="entry-item" data-cat="${cat}" onclick="toggleEntry(this)">
                        <div class="entry-meta-row">
                            <span class="entry-id">entry_${num}</span>
                            <div class="entry-title">
                                <span class="entry-title-text">${title}</span>
                                <span class="entry-toggle"></span>
                            </div>
                        </div>
                        <div class="entry-date">${date}</div>
                        <span class="entry-cat-tag">// ${cat}</span>
                        <div class="entry-body">${body}</div>
                    </div>`;
            });

        } catch (err) {
            container.innerHTML = '<div class="loading-msg">// error loading entries.</div>';
            countEl.textContent = "0 entries";
            console.error(err);
        }
    }

    loadEntries();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.0/lottie.min.js" type="text/javascript"></script>

<div id="preloader">
    <div id="preloader-lottie"></div>
</div>

<script>
    window.addEventListener("load", () => {
        const preloader = document.getElementById("preloader");
        preloader.style.transition = "opacity 0.1s ease";
        setTimeout(() => {
            preloader.style.opacity = "0";
            setTimeout(() => { preloader.style.display = "none"; }, 1000);
        }, 1000);
    });

    lottie.loadAnimation({
        container: document.getElementById("preloader-lottie"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "https://lottie.host/13362e42-cb88-4b54-ab6c-8790f9af29d4/FRIVZw7O0c.json",
        rendererSettings: { progressiveLoad: false }
    });
</script>
